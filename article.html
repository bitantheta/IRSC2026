<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article | IRSC 2026</title>
    <link rel="icon" type="image/webp" href="./assets/images/logo-with-bg.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="article-page">
    <header class="articles-nav"><a href="./editorial.html#scholastic-articles">← Editorial</a><a href="./index.html">IRSC 2026</a></header>
    <main class="article-placeholder-page">
      <p class="article-type">IRSC Editorial</p>
      <h1 id="article-title">Article Title</h1>
      <p id="article-byline" class="article-byline"></p>
      <figure class="article-image-slot"><img id="article-cover" alt="" /></figure>
      <article id="article-body" class="article-body" aria-live="polite"><p>Loading article…</p></article>
      <section class="article-suggestions" aria-labelledby="suggested-articles-title">
        <div class="article-suggestions-header">
          <div><p class="article-type">Keep reading</p><h2 id="suggested-articles-title">Suggested articles</h2></div>
          <div class="article-suggestions-controls"><button id="suggestions-previous" type="button" aria-label="Show previous suggested articles">←</button><button id="suggestions-next" type="button" aria-label="Show next suggested articles">→</button></div>
        </div>
        <div id="suggested-articles" class="suggested-articles-track" aria-label="Suggested articles"></div>
      </section>
    </main>
    <script src="./article-page.js"></script>
  </body>
</html>
